name: 오류 (Bug)
description: 실행 중 생긴 문제 기록
title: "[오류] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      placeholder: 예) 두 차량 정지 후 CARLA 서버가 종료됨
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 실행한 명령어
        2. 사용한 맵·설정
        3. 몇 번 중 몇 번 발생했는지
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 오류 메시지·로그
      render: shell
  - type: input
    id: env
    attributes:
      label: 실행 환경
      placeholder: 예) Ubuntu 22.04, CARLA 0.9.15, Python 3.10.12
