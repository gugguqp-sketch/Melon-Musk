name: 오류 (Bug)
description: 실행 중 생긴 문제 기록
title: "[오류] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      placeholder: 예) 두 차량 정지 후 CARLA 서버가 종료됨
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 실행한 명령어
        2. 사용한 맵·설정
        3. 몇 번 중 몇 번 발생했는지
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 오류 메시지·로그
      render: shell
  - type: input
    id: env
    attributes:
      label: 실행 환경
      placeholder: 예) Ubuntu 22.04, CARLA 0.9.15, Python 3.10.12

blank_issues_enabled: true

name: 실험 기록 (Experiment)
description: 시나리오 시험 결과 공유
title: "[실험] "
labels: ["experiment"]
body:
  - type: dropdown
    id: scenario
    attributes:
      label: 시나리오
      options:
        - 자율차 – 자율차
        - 자율차 – 수동 모사 차량 (양보)
        - 자율차 – 수동 모사 차량 (비양보)
        - 기타 / 기초 시험
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: 조건
      placeholder: 맵, 시작 위치, 접근 속도, 반복 횟수 등
  - type: textarea
    id: result
    attributes:
      label: 결과
      placeholder: |
        - 충돌 이벤트:
        - 최소 차체 간격:
        - 통과 성공 / 안전 대기 / 실패 유형:
        - 대기 시간:
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 결과 파일 위치
      description: 큰 파일은 저장소에 올리지 말고 공유 드라이브 링크를 적어 주세요.

name: 작업 (Task)
description: 구현하거나 정리할 작업
title: "[작업] "
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - 시뮬레이션·제어·통합
        - 관측·판단 로직
        - 데이터 분석·평가
        - 문서·발표
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 할 일
      description: 무엇을, 왜 하는지 적어 주세요.
      placeholder: 예) 차량 B 좌회전 경로의 대기 위치 정하기
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: |
        - [ ] 대기 위치에서 A가 통과 가능한지 확인
        - [ ] 결과 csv 저장
  - type: input
    id: due
    attributes:
      label: 목표 날짜
      placeholder: 예) 10/15
