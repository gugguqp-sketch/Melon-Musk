name: 작업 (Task)
description: 구현하거나 정리할 작업
title: "[작업] "
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - 시뮬레이션·제어·통합
        - 관측·판단 로직
        - 데이터 분석·평가
        - 문서·발표
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 할 일
      description: 무엇을, 왜 하는지 적어 주세요.
      placeholder: 예) 차량 B 좌회전 경로의 대기 위치 정하기
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: |
        - [ ] 대기 위치에서 A가 통과 가능한지 확인
        - [ ] 결과 csv 저장
  - type: input
    id: due
    attributes:
      label: 목표 날짜
      placeholder: 예) 10/15
